name: articulicare
description: "ArticuliCare - Precision Articulation & Clinical Speech Therapy Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Auth Services
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.2.10
  google_sign_in: ^6.2.2

  # Supabase Backend & Database
  supabase_flutter: ^2.8.3

  # State Management & Architecture
  flutter_bloc: ^9.1.1

  # UI Adaptation & Styling
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.1
  intl: ^0.20.3

  # Audio & Speech Recording
  flutter_sound: ^9.17.0
  audioplayers: ^6.1.1

  # Video Drill Playback
  video_player: ^2.9.2

  # Web & Portals
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.1

  # Hardware & Media Access
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
