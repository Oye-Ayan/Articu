name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to prevent free-tier auto-pause
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  ping-supabase:
    name: Database Keep-Alive Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_URL || 'https://ptgzwiosneqdksjclxzz.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0Z3p3aW9zbmVxZGtzamNseHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc4MDcyNjcsImV4cCI6MjA1MzM4MzI2N30.72atrlPnd6H9xa1Sntkk8K-ZFt1JuBJty2EP7893oXw' }}
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::notice::Using project default Supabase credentials. You can also define custom credentials in Settings -> Secrets and variables -> Actions."
          fi
          echo "Executing lightweight keep-alive query against Supabase..."
          
          # Query a single ID with limit 1 to generate legitimate database read activity
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/therapists?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "User-Agent: ArticuliCare-KeepAlive-Bot/1.0" \
            --connect-timeout 15 \
            --max-time 30)

          echo "Response HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Keep-alive ping successful. Supabase database activity registered."
          else
            echo "::warning::Supabase returned HTTP status ${HTTP_STATUS}. Check project status if paused."
            exit 1
          fi
